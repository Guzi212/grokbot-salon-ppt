<!doctype html>
<meta charset="utf-8">
<script>
  // .ppt / .pps / .pot 结尾的访问 → 跳到 Office 在线预览对应的 .pptx
  var p = location.pathname;
  if (/\.(ppt|pps|pot)$/i.test(p)) {
    var src = location.origin + p + 'x';
    location.replace('https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(src));
  } else {
    location.replace(location.origin + '/grokbot-salon-ppt/');
  }
</script>
<title>Opening in Office viewer…</title>
