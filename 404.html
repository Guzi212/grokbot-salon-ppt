<!doctype html>
<meta charset="utf-8">
<script>
  // .ppt / .pps 之类的旧短链自动跳到 .pptx
  var p = location.pathname;
  if (/\.(ppt|pps|pot)$/i.test(p)) {
    location.replace(location.origin + p + 'x' + location.search + location.hash);
  } else {
    location.replace(location.origin + '/grokbot-salon-ppt/');
  }
</script>
<title>Redirecting…</title>
